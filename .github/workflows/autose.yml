name: AutoSE Autonomous SDLC Workflow

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: autose-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  autose_pipeline:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'autose') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/autose'))
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Pinned TinyDB Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml google-genai
          pip install -e .

      - name: Verify Collaborator Authorization Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          PERMISSION=$(gh api repos/$REPO/collaborators/$ACTOR/permission --jq .permission || echo "none")
          if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "write" && "$PERMISSION" != "maintain" ]]; then
            echo "Security Alert: Actor $ACTOR lacks write permissions. Aborting run."
            exit 1
          fi

      - name: Execute AutoSE Autonomous SDLC Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -m workflow.autose.cli \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title "$ISSUE_TITLE" \
            --issue-body "$ISSUE_BODY" \
            --repo-root .

      - name: Upload SDLC Stage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-artifacts-issue-${{ github.event.issue.number }}
          path: .autose/artifacts/
          retention-days: 30
