name: AutoSE PR CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install and Test
        run: |
          pip install -q -e .
          pip install -q pytest pyyaml
          pytest -v -o addopts= tests/
